<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Object P-003">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#ece6da"/>
      <stop offset="1" stop-color="#bfb4a3"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c39a5e"/>
      <stop offset="0.5" stop-color="#8a6234"/>
      <stop offset="1" stop-color="#4d3519"/>
    </linearGradient>
    <filter id="patina">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="4"/>
      <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.64  0 0 0 0 0.54  0 0 0 2.6 -1.2"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <ellipse cx="320" cy="320" rx="220" ry="22" fill="#4a3a2c" opacity="0.3" filter="url(#soft)"/>
  <g id="obj">
    <!-- arched bow with cut decoration -->
    <path d="M150 290 C 190 150 420 130 480 284" fill="none" stroke="url(#bronze)" stroke-width="26" stroke-linecap="round"/>
    <path d="M150 290 C 190 150 420 130 480 284" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round" filter="url(#patina)"/>
    <g stroke="#3a2512" stroke-width="2" opacity="0.7">
      <path d="M262 168 l 6 22"/><path d="M286 161 l 4 22"/><path d="M310 158 l 2 22"/><path d="M334 158 l 0 22"/><path d="M358 161 l -2 22"/><path d="M382 167 l -4 22"/>
    </g>
    <!-- spring coil at the left end -->
    <g fill="none" stroke="#8a6234" stroke-width="7">
      <ellipse cx="140" cy="298" rx="14" ry="22"/><ellipse cx="128" cy="298" rx="14" ry="22"/><ellipse cx="116" cy="298" rx="14" ry="22"/><ellipse cx="104" cy="298" rx="14" ry="22"/>
    </g>
    <g fill="none" stroke="#d4ae74" stroke-width="2" opacity="0.6">
      <path d="M130 278 a14 22 0 0 1 0 40"/><path d="M118 278 a14 22 0 0 1 0 40"/><path d="M106 278 a14 22 0 0 1 0 40"/>
    </g>
    <!-- straight pointed pin -->
    <path d="M104 314 L 492 300" stroke="#7c5a31" stroke-width="6" stroke-linecap="round"/>
    <path d="M490 300 L 512 299" stroke="#7c5a31" stroke-width="3" stroke-linecap="round"/>
    <!-- hooked catch -->
    <path d="M470 278 C 498 282 504 306 486 312 L 470 312" fill="none" stroke="url(#bronze)" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- scale bar: 1 cm = 64 px, so the 410 px object is about 6.5 cm -->
  <g transform="translate(60 420)" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3b2e27">
    <rect x="0" y="0" width="64" height="10" fill="#2b2420"/><rect x="64" y="0" width="64" height="10" fill="#fff" stroke="#2b2420"/>
    <rect x="128" y="0" width="64" height="10" fill="#2b2420"/>
    <text x="0" y="30">0</text><text x="170" y="30">3 cm</text>
  </g>
  <text x="580" y="80" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#3b2e27" opacity="0.8">P-003 · illustration</text>
</svg>
